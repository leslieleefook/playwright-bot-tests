# Bot Testing Suite - Triggering re-parse
name: Bot Testing Suite

on:
  schedule:
    - cron: "0 12 * * *" # Run daily at 12:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Create .tmp directory
        run: mkdir -p .tmp

      - name: Restore Gmail Session
        run: |
          echo '${{ secrets.GMAIL_STORAGE_STATE }}' > .tmp/storageState.json
        shell: bash

      - name: Run Bot Interaction Suite
        run: node execution/master_bot_test.js
        env:
          FAILURE_RECIPIENT: ${{ secrets.FAILURE_RECIPIENT || 'leslieleefook@incusservices.com' }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
