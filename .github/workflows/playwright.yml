name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    schedule:
        - cron: "0 0 * * *" # Daily at midnight

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shardIndex: [1, 2, 3]
                shardTotal: [3]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: "npm"

            - name: Install dependencies
              run: npm install

            - name: Cache Playwright Browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run Playwright tests
              run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
              env:
                  TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
                  TEST_EMAIL_PASSWORD: ${{ secrets.TEST_EMAIL_PASSWORD }}
                  IMAP_USER: ${{ secrets.IMAP_USER }}
                  IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
                  IMAP_HOST: ${{ secrets.IMAP_HOST }}
                  IMAP_PORT: ${{ secrets.IMAP_PORT }}
                  SMTP_HOST: ${{ secrets.SMTP_HOST }}
                  SMTP_PORT: ${{ secrets.SMTP_PORT }}
                  # Skip email verification in CI - IMAP connections are unreliable in GitHub Actions
                  SKIP_EMAIL_VERIFICATION: "true"

            - name: Upload Blob Report to GitHub Actions Artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: all-blob-reports-${{ matrix.shardIndex }}
                  path: blob-report
                  retention-days: 1

    merge_reports:
        # Merge reports after all shards are done
        if: always()
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 18
            - name: Install dependencies
              run: npm install
            - name: Download all individual reports
              uses: actions/download-artifact@v4
              with:
                  path: all-blob-reports
                  pattern: all-blob-reports-*
                  merge-multiple: true

            - name: Merge reports
              run: npx playwright merge-reports --reporter html ./all-blob-reports

            - name: Upload Final HTML Report
              uses: actions/upload-artifact@v4
              with:
                  name: final-html-report
                  path: playwright-report
                  retention-days: 7

            - name: Deploy to GitHub Pages
              if: github.event_name == 'schedule' || github.event_name == 'push'
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./playwright-report
                  user_name: "github-actions[bot]"
                  user_email: "github-actions[bot]@users.noreply.github.com"
